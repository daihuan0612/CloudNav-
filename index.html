<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="空行" />
    <meta name="copyright" content="Copyright (c) 空行 — https://github.com/daihuan0612/CloudNav-" />
    <link rel="author" href="https://github.com/daihuan0612/CloudNav-" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的导航</title>
    <script>
      // 尽早应用站点自定义名称/图标：读取本地缓存，让「解锁界面」和「加载瞬间」也显示自定义名
      // 说明：没解锁过的全新浏览器没有缓存，此时显示上方默认名（有意为之，避免把站名对外公开）
      (function () {
        try {
          var raw = localStorage.getItem('cloudnav_site_settings');
          if (!raw) return;
          var s = JSON.parse(raw) || {};
          if (s.title) document.title = s.title;
          if (s.navTitle && !s.title) document.title = s.navTitle;
          if (s.favicon) {
            var el = document.querySelector("link[rel~='icon']");
            if (el) el.href = s.favicon;
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#3b82f6',
              secondary: '#64748b',
              dark: '#0f172a',
              card: '#1e293b',
            },
            boxShadow: {
              glow: '0 0 0 1px rgba(59,130,246,.10), 0 8px 30px -6px rgba(59,130,246,.25)',
              card: '0 1px 2px 0 rgba(0,0,0,0.05)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbar for sidebar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Simple CSS-only tooltip transition */
      .tooltip-custom {
          transition: opacity 0.2s, visibility 0.2s;
          pointer-events: none;
      }
      /* 全局细滚动条 */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(100,116,139,.28); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,.5); background-clip: content-box; }
      /* 卡片 hover 光晕与上浮 */
      .card-lift { transition: box-shadow .22s ease, border-color .22s ease; }
      .card-lift:hover { border-color: #3b82f6; box-shadow: 0 14px 28px rgba(15,23,42,.08), 0 6px 12px rgba(15,23,42,.04); }
      /* 入场动画 */
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .fade-up { animation: fadeUp .45s cubic-bezier(.4,0,.2,1) both; }
      /* 分类标题渐变竖条 */
      .cat-bar { width: 4px; height: 20px; border-radius: 4px; background: linear-gradient(180deg, #3b82f6, #8b5cf6); box-shadow: 0 0 12px rgba(99,102,241,.35); }

      /* 手机上长按卡片 = 右键（App.tsx 里的 handleCardTouchStart）。
         这里禁掉 iOS 自带的"链接预览/放大镜"和文字选择，否则它们会和长按菜单抢同一个手势。 */
      .no-callout {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* ⚠️ iOS Safari 的已知行为：聚焦到 font-size < 16px 的输入框时，会把整个页面放大，
         而且失焦之后**不会自动缩回去**。本站的解锁密码框带 autoFocus、搜索框/各弹窗输入框
         又都是 text-sm(14px)，于是"每次打开都是放大状态，必须手动捏一下"。
         这里在手机/触屏设备上统一把输入类控件抬到 16px（鼠标桌面端保持原样，视觉不变）。 */
      @media (max-width: 640px), (pointer: coarse) {
        input, select, textarea { font-size: 16px !important; }
      }
    </style>
</head>
  <body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
