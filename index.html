<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="空行" />
    <meta name="copyright" content="Copyright (c) 空行 — https://github.com/daihuan0612/CloudNav-" />
    <link rel="author" href="https://github.com/daihuan0612/CloudNav-" />
    <!-- 站点图标：内联 SVG（以前指向 https://lucide.dev/favicon.ico，境外站加载不上就变成空白标签页图标） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7.5l6.5 17L16 20.2l-6.5 4.3z' fill='%23fff'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的导航</title>
    <script>
      // 尽早应用站点自定义名称/图标：读取本地缓存，让「解锁界面」和「加载瞬间」也显示自定义名
      // 说明：没解锁过的全新浏览器没有缓存，此时显示上方默认名（有意为之，避免把站名对外公开）
      (function () {
        try {
          var raw = localStorage.getItem('cloudnav_site_settings');
          if (!raw) return;
          var s = JSON.parse(raw) || {};
          if (s.title) document.title = s.title;
          if (s.navTitle && !s.title) document.title = s.navTitle;
          if (s.favicon) {
            var el = document.querySelector("link[rel~='icon']");
            if (el) el.href = s.favicon;
          }
        } catch (e) {}
      })();
    </script>
    <!-- Tailwind 由 index.css 在构建时编译（不再引 cdn.tailwindcss.com，见 index.css 顶部说明） -->
  </head>
  <body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
